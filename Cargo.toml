[package]
name = "sekhmetx"
version = "0.6.6"
edition = "2024"
description = "SekhmetX: a fast, native cross-platform DICOM viewer in Rust (modeled on IsiX / Horos / OsiriX)"
license = "LGPL-3.0-or-later"

[dependencies]
anyhow = "1"
bytemuck = "1"
flate2 = "1"
walkdir = "2.5"
rayon = "1"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

# GUI: egui via eframe (OpenGL renderer works on any Windows PC)
eframe = { version = "0.37", default-features = true }
# Native "Open folder" dialog
rfd = "0.17"
# Cross-platform clipboard (for Ctrl+C anonymized HD viewport screenshot)
arboard = "3"

# Auto-update (GitHub Releases check + in-place binary replacement)
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
self-replace = "1"
sha2 = "0.10"
tempfile = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Local crash-safe SQLite database (WAL mode, metadata + paths only)
rusqlite = { version = "0.42", features = ["bundled"] }

# DICOM (pure Rust, from the dicom-rs project)
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-core = "0.10"
# native = JPEG baseline/lossless, RLE, deflate; openjpeg-sys = JPEG 2000 via the reference OpenJPEG C library (built from source, no install needed)
dicom-pixeldata = { version = "0.10", default-features = false, features = ["rayon", "native", "openjpeg-sys", "image"] }

[features]
default = ["jpegls"]
# JPEG-LS support needs a C++ compiler + CMake; enable with --features jpegls
jpegls = ["dicom-pixeldata/charls"]

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Decode quickly even in debug builds
[profile.dev.package."*"]
opt-level = 2
