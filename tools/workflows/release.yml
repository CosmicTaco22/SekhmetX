name: Release

# Automatically builds Windows release binaries, extracts release notes from
# CHANGELOG.md, and publishes a GitHub Release whenever a `v*` tag (e.g. v0.2.0)
# is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run full test suite
        run: cargo test --release

      - name: Build release binary
        run: cargo build --release

      - name: Verify CLI
        run: target\release\rdicom-viewer.exe --help

      - name: Package release archive & extract changelog notes
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          Write-Host "Packaging release for tag=$tag (version=$ver)"

          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path dist/rdicom-viewer | Out-Null
          Copy-Item target/release/rdicom-viewer.exe dist/rdicom-viewer/
          Copy-Item README.md dist/rdicom-viewer/
          Copy-Item CHANGELOG.md dist/rdicom-viewer/
          Compress-Archive -Path dist/rdicom-viewer/* -DestinationPath "dist/rdicom-viewer-${tag}-windows-x86_64.zip" -Force

          # Extract section for [$ver] from CHANGELOG.md
          $lines = Get-Content CHANGELOG.md
          $inSection = $false
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $lines) {
            if ($line -match "^## \[$([regex]::Escape($ver))\]") {
              $inSection = $true
              continue
            }
            if ($inSection -and ($line -match "^## \[")) {
              break
            }
            if ($inSection) {
              $notes.Add($line)
            }
          }
          if ($notes.Count -eq 0) {
            $notes.Add("Release $tag of RDicom Viewer. See CHANGELOG.md for details.")
          }
          $notesText = ($notes -join "`n").Trim()
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notesText -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RDicom Viewer ${{ github.event.inputs.tag || github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/rdicom-viewer-*-windows-x86_64.zip
            target/release/rdicom-viewer.exe
