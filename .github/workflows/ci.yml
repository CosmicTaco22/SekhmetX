name: CI (macOS, Windows, Linux)

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: Security Audit (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (ARM64 native)
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - name: Windows (ARM64)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libgl-dev libegl1-mesa-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Set up MSVC for Windows ARM64 cross-compile
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run clippy (release)
        if: ${{ !matrix.cross }}
        run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

      - name: Run unit tests (release)
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Self-test CLI
        if: ${{ !matrix.cross }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            target/${{ matrix.target }}/release/sekhmetx.exe --help
          else
            target/${{ matrix.target }}/release/sekhmetx --help
          fi
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekhmetx-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/sekhmetx*
            !target/${{ matrix.target }}/release/*.d
            !target/${{ matrix.target }}/release/*.pdb
            README.md
            CHANGELOG.md
