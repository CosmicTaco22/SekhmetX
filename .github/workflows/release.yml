name: Release (macOS, Windows, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  verify-release-version:
    name: Verify 3-part Release Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse 4-part internal versions
        shell: bash
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: Refusing to publish 4-part internal version ($REF_NAME). Only 3-part versions (vX.Y.Z) may be released."
            exit 1
          fi
          PKG_VER=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$PKG_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "ERROR: Cargo.toml version ($PKG_VER) must be 3-part for releases."
            exit 1
          fi

  build-release:
    needs: verify-release-version
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64 (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_slug: macos-arm64
            cross: false
          - label: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_slug: windows-x86_64
            cross: false
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_slug: windows-arm64
            cross: true
          - label: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_slug: linux-x86_64
            cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libgl-dev libegl1-mesa-dev libvulkan-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libdbus-1-dev

      - name: Set up MSVC for Windows ARM64 cross-compile
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run unit tests (release)
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Code signing runs only when a certificate is stored in the repository
      # secrets (see docs/SIGNING.md); otherwise builds stay unsigned, as before.
      - name: Sign Windows executable (when a certificate is configured)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) { Write-Host "No signing certificate configured: the executable stays unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 "target/${{ matrix.target }}/release/sekhmetx.exe"
          Remove-Item $pfx

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path dist/sekhmetx | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sekhmetx.exe" dist/sekhmetx/
          Copy-Item README.md dist/sekhmetx/
          Copy-Item CHANGELOG.md dist/sekhmetx/
          Copy-Item LICENSE, COPYING, NOTICE dist/sekhmetx/
          Compress-Archive -Path dist/sekhmetx/* -DestinationPath "dist/sekhmetx-${tag}-${{ matrix.artifact_slug }}.zip" -Force

      - name: Build Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          $arch = if ("${{ matrix.target }}" -like "aarch64*") { "arm64" } else { "x64compatible" }
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$ver" "/DArch=$arch" "/DRepoDir=$PWD" "/DSourceDir=$PWD\dist\sekhmetx" "/DOutputDir=$PWD\dist" "/DOutputName=sekhmetx-${tag}-${{ matrix.artifact_slug }}-setup" packaging\windows\sekhmetx.iss

      - name: Sign Windows installer (when a certificate is configured)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX_BASE64) { Write-Host "No signing certificate configured: the installer stays unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -Last 1
          Get-ChildItem dist -Filter *-setup.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
          }
          Remove-Item $pfx

      - name: Package macOS .app & tar.gz
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          mkdir -p dist/sekhmetx
          cp "target/${{ matrix.target }}/release/sekhmetx" dist/sekhmetx/
          cp README.md CHANGELOG.md LICENSE COPYING NOTICE dist/sekhmetx/
          tar -C dist -czf "dist/sekhmetx-${TAG}-${{ matrix.artifact_slug }}.tar.gz" sekhmetx

          APP_DIR="dist/SekhmetX.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/sekhmetx" "$APP_DIR/Contents/MacOS/sekhmetx"
          cp LICENSE COPYING NOTICE "$APP_DIR/Contents/Resources/"
          # App icon from the 1024 px drawing.
          ICONSET="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon/sekhmetx-1024.png --out "$ICONSET/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon/sekhmetx-1024.png --out "$ICONSET/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP_DIR/Contents/Resources/AppIcon.icns"
          VER="${TAG#v}"
          cat > "$APP_DIR/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>sekhmetx</string>
            <key>CFBundleIdentifier</key><string>com.sekhmetx.viewer</string>
            <key>CFBundleName</key><string>SekhmetX</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleShortVersionString</key><string>VERSION_PLACEHOLDER</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/VERSION_PLACEHOLDER/${VER}/" "$APP_DIR/Contents/Info.plist"

          # Developer ID signing and notarization, only when configured (docs/SIGNING.md).
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p temp "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p temp "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN"
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_DIR" || echo "codesign failed: the app stays unsigned"
            if [ -n "$APPLE_ID" ]; then
              ditto -c -k --keepParent "$APP_DIR" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait \
                && xcrun stapler staple "$APP_DIR" || echo "notarization failed: the app is signed but not notarized"
            fi
            rm -f "$RUNNER_TEMP/cert.p12"
          else
            echo "No Apple signing certificate configured: the app stays unsigned."
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "dist/sekhmetx-${TAG}-macos-arm64-app.zip"

      - name: Package Linux tar.gz
        if: runner.os == 'Linux'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          mkdir -p dist/sekhmetx
          cp "target/${{ matrix.target }}/release/sekhmetx" dist/sekhmetx/
          cp README.md CHANGELOG.md LICENSE COPYING NOTICE dist/sekhmetx/
          cp assets/icon/sekhmetx-256.png dist/sekhmetx/sekhmetx.png
          cp packaging/linux/sekhmetx.desktop dist/sekhmetx/
          tar -C dist -czf "dist/sekhmetx-${TAG}-${{ matrix.artifact_slug }}.tar.gz" sekhmetx

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_slug }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog notes
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          VER="${TAG#v}"
          python3 - "$VER" "$TAG" << 'PY'
          import re, sys
          ver, tag = sys.argv[1], sys.argv[2]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          in_sec, out = False, []
          pat = re.compile(rf"^## \[{re.escape(ver)}\]")
          for ln in lines:
              if pat.match(ln):
                  in_sec = True
                  continue
              if in_sec and ln.startswith("## ["):
                  break
              if in_sec:
                  out.append(ln)
          text = "\n".join(out).strip() or f"Release {tag} of SekhmetX."
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(text + "\n")
          PY

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz $(ls *-setup.exe 2>/dev/null) > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SekhmetX ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*-setup.exe
            artifacts/SHA256SUMS
