names = ['IsiX(Database|Network|Viewer)Adapter', 'HorosDCMFacade', 'HorosArchitectureAudit', 'HorosPlatformPolicy',
         'HorosObjCException', 'MainActorCallbacks', 'DeferredCalls', 'ObservedThread', 'HorosBoundedTask']

[[area]]
