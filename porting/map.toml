# RDicom porting map
#
# Every file in IsiX (github.com/ThalesMMS/IsiX-DICOM-Viewer-macOS), and in
# Horos, which IsiX is forked from, belongs to exactly one area below.
# tools/upstream.py uses this file to sort upstream changes by area, and to
# generate PORTING_MAP.md.
#
# How files are matched: areas are tried in the order they appear in this file,
# and the first match wins.
#   paths  regular expressions searched against the full path in the repo
#   names  regular expressions that must match the whole file name, without
#          extension and without an Objective-C "+Category" suffix
#          (e.g. "DCMView+Drawing.m" is matched as "DCMView")
# Broad, folder-based areas come first; feature areas follow.
#
# Field meanings:
#   decision  port     translate the logic to Rust (with its tests)
#             rebuild  recreate the screen/behaviour in Rust (egui + wgpu), matching Horos
#             replace  use an existing Rust crate instead
#             reuse    copy the data files as they are
#             skip     not planned
#             meta     build files, docs, tests, translations: not app code
#   priority  1 = daily reading core, 2 = next, 3 = later, 4 = maybe, 0 = never
#   progress  todo / partial / done (for RDicom)
#   rdicom    where it lives (or will live) in RDicom
#   ported_from  IsiX commit the RDicom code was last brought up to date with

# ---------------------------------------------------------------- folder-based

[[area]]
id = "meta"
name = "Build system, docs, scripts, test harnesses, release tooling"
decision = "meta"
priority = 0
progress = "done"
paths = ['^(DicomImporter|Horos Launcher|LetsMoveAndDock)/', '^DCM Framework/(DCMSampleApp|Sample App)/',
         
  '^(tests|tools|script|updates|screenshots|Examples|API|Binaries|FinderPreview|Decompress)/',
  '^Horos\.xcodeproj/', '^Horos/(Scripts|Configuration|Unit Tests)/',
  '^[^/]+$',                         # top-level files: README, Makefile, licences...
  '^Horos/[^/]+$',                   # Info.plist, entitlements, xcconfig, pch
  '^\.github/', '^Modules/Package\.swift$',
]

[[area]]
id = "translations-icons"
name = "Translations, icons, help pages"
decision = "meta"
priority = 0
progress = "done"
notes = "Icons are Horos artwork: draw our own. Spanish UI text can be added later."
paths = [
  '^Horos/Resources/[^/]+\.lproj/', '^Horos/Resources/Icons/',
  '^Horos/Resources/(iChatTheatreHelp|WebServicesHTML|QTExport[^/]*|ReportsToPDF)',
  '^Horos/Resources/.*\.(png|tiff?|icns|pdf|jpg|gif|html|css|js|xib|nib|storyboard|strings|rtf)$',
]

[[area]]
id = "data-assets"
name = "Colour tables, 3D presets, DICOM dictionaries"
decision = "reuse"
priority = 1
progress = "todo"
rdicom = "assets/"
crates = "plist"
notes = "CLUTs and 3D presets are plain data files: load them directly. Check licence notes for the dicom3tools tables."
paths = ['^Horos/Resources/']

[[area]]
id = "third-party"
name = "Bundled third-party code (OpenSSL, libarchive, VTK/ITK helpers, codecs)"
decision = "replace"
priority = 0
progress = "done"
crates = "rustls, zip/tar, dicom-pixeldata (OpenJPEG, CharLS)"
paths = ['^DCM Framework/jasper/', '^NIfTI_Library/', '^Papyrus3/',
         '^Horos/Sources/ThirdParty/', '^OpenSSL/', '^Horos/Models/']
names = ['JRSwizzle', 'altivecFunctions', 'kdu_.*', 'OPJSupport',
         'archive(_entry)?', 'options', 'url', 'vtk.*', 'Horos-Bridging-Header']

[[area]]
id = "glue"
